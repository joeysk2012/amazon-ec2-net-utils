version: 0.2

phases:
  install:
    commands:
      - dnf -y install make rpm-build shellcheck git

  pre_build:
    commands:
      - echo "Ensuring full git history and tags are available for git describe"
      - git rev-parse --is-shallow-repository | grep -q true && git fetch --unshallow --tags || git fetch --tags
      - git describe --dirty --tags || echo "WARNING: git describe failed, scratch-rpm version may be wrong"

  build:
    commands:
      - echo "Running shellcheck via make check"
      - make check
      - echo "Building scratch RPM from current checkout"
      - make scratch-rpm

  post_build:
    commands:
      - mkdir -p dist
      - cp RPMS/*/*.rpm dist/
      - cp -r .github/deploy/scripts dist/scripts
      - cp .github/deploy/appspec.yml dist/

artifacts:
  base-directory: dist
  files:
    - '**/*'
